# Todo valor llega por variable de entorno. Ningun secreto vive en el repositorio.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI}
          audiences: ${OIDC_AUDIENCIA:coprop-api}
      client:
        registration:
          coprop-web:
            client-id: ${OIDC_CLIENT_ID:coprop-web}
            client-secret: ${OIDC_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            scope: openid,email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          coprop-web:
            issuer-uri: ${OIDC_ISSUER_URI}
            authorization-uri: ${OIDC_ISSUER_URI}/protocol/openid-connect/auth
            token-uri: ${OIDC_ISSUER_URI}/protocol/openid-connect/token
            jwk-set-uri: ${OIDC_ISSUER_URI}/protocol/openid-connect/certs
            user-info-uri: ${OIDC_ISSUER_URI}/protocol/openid-connect/userinfo
            user-name-attribute: sub
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

coprop:
  storage:
    endpoint: ${STORAGE_ENDPOINT}
    bucket: ${STORAGE_BUCKET}
    access-key: ${STORAGE_ACCESS_KEY}
    secret-key: ${STORAGE_SECRET_KEY}
    region: ${STORAGE_REGION:us-east-1}

logging:
  level:
    root: INFO
    bo.coprop: INFO
  structured:
    format:
      # Una linea JSON por evento, con el MDC entero y todo enmascarado. En local no se activa:
      # alli manda la legibilidad y el enmascarado lo aplica el patron de logback-spring.xml.
      console: bo.coprop.shared.FormatoJsonDeLog
