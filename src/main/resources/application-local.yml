# Perfil de desarrollo. Apunta a los servicios de docker-compose.yml.
spring:
  datasource:
    url: jdbc:postgresql://localhost:15432/coprop
    username: coprop
    password: coprop
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/coprop
          # La audiencia la pone el mapeador del realm (issue #12). Sin esto, un token emitido para
          # cualquier otro cliente del mismo realm serviria contra esta API.
          audiences: coprop-api
  mail:
    host: localhost
    port: 1025
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

springdoc:
  swagger-ui:
    # La consola navegable, en http://localhost:8080/swagger-ui.html. Solo aqui: en produccion el
    # webjar ni siquiera entra al artefacto (ver build.gradle.kts). Esta misma propiedad es la que
    # abre sus rutas en la cadena de seguridad, para que no haya dos interruptores que puedan
    # quedar en desacuerdo.
    enabled: true

coprop:
  oidc:
    # El cliente confidencial del BFF. El navegador no lo ve nunca. Va aqui y no en
    # spring.security.oauth2.client porque con issuer-uri Boot descarga el documento de
    # descubrimiento al arrancar: ver ConfiguracionDeOidc.
    emisor: http://localhost:8081/realms/coprop
    cliente-id: coprop-web
    cliente-secreto: coprop-local-secret-web
  storage:
    endpoint: http://localhost:9000
    bucket: coprop-local
    access-key: coprop
    secret-key: coprop-local-secret
    region: us-east-1

logging:
  level:
    bo.coprop: DEBUG
    org.flywaydb: INFO
