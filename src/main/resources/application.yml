spring:
  application:
    name: coprop-backend
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo gobierna Flyway. El arranque falla si las entidades no coinciden.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  threads:
    virtual:
      enabled: true
  data:
    web:
      pageable:
        # El cliente pide ?page=0&size=20&sort=campo,desc. El tope evita que una
        # peticion con size=100000 arrastre la tabla entera.
        default-page-size: 20
        max-page-size: 100
        one-indexed-parameters: false

springdoc:
  api-docs:
    # El criterio del issue #5 fija esta ruta; por defecto springdoc usa /v3/api-docs.
    path: /api/openapi.json
  swagger-ui:
    enabled: false

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  error:
    # Los errores salen en problem+json desde el manejador central, nunca con stacktrace.
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,modulith
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      # Un SMTP caido no es motivo para declarar enferma la aplicacion, y menos para que un
      # orquestador la reinicie: el reinicio no arregla un servidor de correo ajeno. Se descubrio
      # en CI, donde no hay Mailpit y el health raiz devolvia 503 con la aplicacion perfectamente
      # viva. Si interesa vigilar el correo, va como metrica, no como salud.
      enabled: false
  metrics:
    tags:
      # Toda metrica sale etiquetada con la aplicacion, para poder separarlas cuando haya mas de
      # un servicio apuntando al mismo sitio.
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    bo.coprop: INFO
