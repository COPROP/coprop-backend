spring:
  application:
    name: coprop-backend
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo gobierna Flyway. El arranque falla si las entidades no coinciden.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  error:
    # Los errores salen en problem+json desde el manejador central, nunca con stacktrace.
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,modulith
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    bo.coprop: INFO
