spring:
  application:
    name: coprop-backend
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo gobierna Flyway. El arranque falla si las entidades no coinciden.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  threads:
    virtual:
      enabled: true
  session:
    # La sesion del BFF vive en la base: sobrevive a un reinicio y se puede revocar (Seguridad 5.1).
    # El esquema lo crea la migracion V6 y no Spring Session, porque aqui manda Flyway.
    jdbc:
      initialize-schema: never
    # Seguridad 5.3 pide una hora de inactividad para roles administrativos y 24 para propietarios.
    # Esto es lo unico que se puede fijar hoy: los roles por condominio viven en la base de COPROP,
    # no en la sesion, asi que distinguirlos por rol es del issue #22 junto con la reautenticacion.
    timeout: 24h
  data:
    web:
      pageable:
        # El cliente pide ?page=0&size=20&sort=campo,desc. El tope evita que una
        # peticion con size=100000 arrastre la tabla entera.
        default-page-size: 20
        max-page-size: 100
        one-indexed-parameters: false

springdoc:
  api-docs:
    # El criterio del issue #5 fija esta ruta; por defecto springdoc usa /v3/api-docs.
    path: /api/openapi.json
  swagger-ui:
    enabled: false

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  error:
    # Los errores salen en problem+json desde el manejador central, nunca con stacktrace.
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,modulith
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      # Un SMTP caido no es motivo para declarar enferma la aplicacion, y menos para que un
      # orquestador la reinicie: el reinicio no arregla un servidor de correo ajeno. Se descubrio
      # en CI, donde no hay Mailpit y el health raiz devolvia 503 con la aplicacion perfectamente
      # viva. Si interesa vigilar el correo, va como metrica, no como salud.
      enabled: false
  metrics:
    tags:
      # Toda metrica sale etiquetada con la aplicacion, para poder separarlas cuando haya mas de
      # un servicio apuntando al mismo sitio.
      application: ${spring.application.name}

coprop:
  # El correo del primer superadministrador. La aplicacion lo abre al arrancar SOLO si no hay
  # ninguno, asi que dejarlo puesto no es una puerta trasera: en cuanto existe uno, deja de hacer
  # nada. Vacio por defecto; en produccion llega por variable de entorno.
  superadministrador-inicial: ${COPROP_SUPERADMIN_INICIAL:}
  web:
    # A donde vuelve el navegador despues de iniciar o cerrar sesion. En produccion la SPA y la API
    # van tras el mismo dominio; en desarrollo la SPA la sirve el dev server de Angular.
    #
    # Es tambien la base del enlace de las invitaciones (issue #18): el correo manda a la WEB y no
    # a la API, porque la pagina es la que sabe que mostrar en cada caso y la que manda al login.
    url: ${COPROP_WEB_URL:http://localhost:4200}
  correo:
    # El remitente de todo correo que salga. Sin esto, SimpleMailMessage sale sin From y muchos
    # servidores lo rechazan; Mailpit lo acepta, asi que el fallo aparece recien en produccion.
    remitente: ${COPROP_CORREO_REMITENTE:no-responder@coprop.bo}

logging:
  level:
    root: INFO
    bo.coprop: INFO
