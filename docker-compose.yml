name: coprop

# Entorno de desarrollo local. Nada de esto va a produccion: las credenciales de aqui son
# literales a proposito, para que `docker compose up` funcione sin configuracion previa.

services:
  postgres:
    image: postgres:16-alpine
    container_name: coprop-postgres
    environment:
      POSTGRES_DB: coprop
      POSTGRES_USER: coprop
      POSTGRES_PASSWORD: coprop
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coprop -d coprop"]
      interval: 5s
      timeout: 3s
      retries: 12

  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    container_name: coprop-keycloak
    command:
      - start-dev
      - --import-realm
      - --http-port=8081
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8081:8081"
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro

  # MinIO ya no se distribuye en los registries publicos: minio/minio y minio/mc salieron de
  # Docker Hub y quay.io/minio exige autenticacion. Se usa el archivo congelado de Bitnami, que es
  # el mismo MinIO con la misma API S3. No recibe parches nuevos y no importa, porque este servicio
  # nunca sale de la maquina de desarrollo. Si alguna vez hace falta MinIO en tests con
  # Testcontainers, hay que forzar esta misma imagen: la de por defecto ya no resuelve.
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    container_name: coprop-minio
    environment:
      MINIO_ROOT_USER: coprop
      MINIO_ROOT_PASSWORD: coprop-local-secret
      # Crea el bucket al arrancar. Sustituye al contenedor minio-init que hacia falta antes.
      MINIO_DEFAULT_BUCKETS: coprop-local
    # Esta version de MinIO ya no trae la consola web: la quitaron del build AGPL en 2025. Solo
    # escucha la API en 9000, asi que no hay puerto de consola que publicar. Para inspeccionar el
    # bucket a mano: docker exec coprop-minio mc ls local/coprop-local
    ports:
      - "9000:9000"
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12

  mailpit:
    image: axllent/mailpit:v1.31
    container_name: coprop-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  postgres-data:
  minio-data:
