name: coprop

# Entorno de desarrollo local. Nada de esto va a produccion: las credenciales de aqui son
# literales a proposito, para que `docker compose up` funcione sin configuracion previa.

services:
  postgres:
    image: postgres:16-alpine
    container_name: coprop-postgres
    environment:
      POSTGRES_DB: coprop
      POSTGRES_USER: coprop
      POSTGRES_PASSWORD: coprop
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coprop -d coprop"]
      interval: 5s
      timeout: 3s
      retries: 12

  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    container_name: coprop-keycloak
    command:
      - start-dev
      - --import-realm
      - --http-port=8081
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8081:8081"
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro

  minio:
    image: minio/minio:latest
    container_name: coprop-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: coprop
      MINIO_ROOT_PASSWORD: coprop-local-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Crea el bucket al arrancar y termina. No es un servicio permanente.
  minio-init:
    image: minio/mc:latest
    container_name: coprop-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        mc alias set local http://minio:9000 coprop coprop-local-secret
        mc mb --ignore-existing local/coprop-local
        mc anonymous set none local/coprop-local
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.31
    container_name: coprop-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  postgres-data:
  minio-data:
